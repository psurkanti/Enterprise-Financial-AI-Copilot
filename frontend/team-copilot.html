<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enterprise Financial AI Copilot</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      .team-shell {
        max-width: 1280px;
        margin: 0 auto;
        padding: 1.25rem;
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div class="team-shell">
      <div class="copilot-hero">
        <div class="copilot-hero-main">
          <h1 class="copilot-product-title">Enterprise Financial AI Copilot</h1>
          <p class="copilot-product-subtitle">Ask natural language questions over uploaded financial data</p>
        </div>
      </div>

      <div class="copilot-prompt-grid" id="copilotPromptCards">
        <button type="button" class="copilot-prompt-card" data-q="Give me financial overview">Give me financial overview</button>
        <button type="button" class="copilot-prompt-card" data-q="How many customers do we have?">How many customers do we have?</button>
        <button type="button" class="copilot-prompt-card" data-q="Show overdue invoices above $50K">Show overdue invoices above $50K</button>
        <button type="button" class="copilot-prompt-card" data-q="Which customers are high risk?">Which customers are high risk?</button>
        <button type="button" class="copilot-prompt-card" data-q="Which region has highest outstanding balance?">Which region has highest outstanding balance?</button>
        <button type="button" class="copilot-prompt-card" data-q="Summarize AR risk by region">Summarize AR risk by region</button>
        <button type="button" class="copilot-prompt-card" data-q="Show top 10 customers by balance">Show top 10 customers by balance</button>
        <button type="button" class="copilot-prompt-card" data-q="Give collection priority list">Give collection priority list</button>
      </div>

      <div class="copilot-layout copilot-layout-premium copilot-chat-full">
        <div class="panel copilot-chat-card">
          <div id="chatHistory" class="chat-history chat-history-premium"></div>
          <div class="chat-compose">
            <input id="questionInput" type="text" placeholder="Ask anything about invoices, risk, regions, or collections…" autocomplete="off" />
            <button id="askBtn" class="copilot-send-btn" type="button">Ask Copilot</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      const apiBase = window.location.origin;
      const state = {
        sessionId: sessionStorage.getItem("teamCopilotSessionId") || "",
      };

      function appendChatBubble(role, text) {
        const chat = document.getElementById("chatHistory");
        const row = document.createElement("div");
        row.className = `chat-message-row ${role}`;
        if (role === "bot") {
          const avatar = document.createElement("span");
          avatar.className = "copilot-avatar small";
          avatar.textContent = "✦";
          const div = document.createElement("div");
          div.className = `chat-bubble ${role}`;
          div.textContent = text;
          row.append(avatar, div);
        } else {
          const div = document.createElement("div");
          div.className = `chat-bubble ${role}`;
          div.textContent = text;
          row.appendChild(div);
        }
        chat.appendChild(row);
        chat.scrollTop = chat.scrollHeight;
        return row;
      }

      function showTypingIndicator() {
        const chat = document.getElementById("chatHistory");
        const row = document.createElement("div");
        row.className = "copilot-typing-row";
        const avatar = document.createElement("span");
        avatar.className = "copilot-avatar";
        avatar.textContent = "✦";
        const dots = document.createElement("div");
        dots.className = "typing-dots";
        for (let i = 0; i < 3; i += 1) dots.appendChild(document.createElement("span"));
        row.append(avatar, dots);
        chat.appendChild(row);
        chat.scrollTop = chat.scrollHeight;
        return row;
      }

      function buildInlineRecordsTable(records, maxHeightPx) {
        const wrap = document.createElement("div");
        wrap.className = "table-wrap copilot-inline-table";
        if (maxHeightPx) wrap.style.maxHeight = `${maxHeightPx}px`;
        const table = document.createElement("table");
        const thead = document.createElement("thead");
        const tbody = document.createElement("tbody");
        if (!records || records.length === 0) {
          const tr = document.createElement("tr");
          const td = document.createElement("td");
          td.textContent = "No matching rows for this answer.";
          tr.appendChild(td);
          tbody.appendChild(tr);
          table.append(thead, tbody);
          wrap.appendChild(table);
          return wrap;
        }
        const columns = Object.keys(records[0]);
        const hr = document.createElement("tr");
        columns.forEach((c) => {
          const th = document.createElement("th");
          th.textContent = c;
          hr.appendChild(th);
        });
        thead.appendChild(hr);
        records.forEach((row) => {
          const tr = document.createElement("tr");
          columns.forEach((c) => {
            const td = document.createElement("td");
            td.textContent = row[c] ?? "";
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
        table.append(thead, tbody);
        wrap.appendChild(table);
        return wrap;
      }

      function sanitizeSummaryText(text) {
        const t = String(text || "").trim();
        if (!t) return t;
        // JS does not support inline modifiers like (?is). Use [\s\S]*? to mimic dotall.
        let out = t;
        out = out.replace(
          /^\s*(enterprise financial ai copilot|our copilot)\s+(found|identified|located)\s+[\s\S]*?(?:\.\s*)?$/i,
          ""
        );
        out = out.replace(/found\s+\d+\s+matching\s+records\b[\s\S]*?(?:\.\s*)?$/i, "");
        out = out.replace(/\bmatching\s+records\b/i, "");
        return out.trim();
      }

      function appendStructuredCopilotMessage(data) {
        const chat = document.getElementById("chatHistory");
        const style = data.response_style || "direct";
        const records = data.matching_records || [];
        if (typeof data.summary === "string") data.summary = sanitizeSummaryText(data.summary);

        if (style === "direct") {
          const row = document.createElement("div");
          row.className = "chat-message-row bot";
          const avatar = document.createElement("span");
          avatar.className = "copilot-avatar small";
          avatar.textContent = "✦";
          const div = document.createElement("div");
          div.className = "chat-bubble bot";
          div.textContent = data.summary || "—";
          row.append(avatar, div);
          chat.appendChild(row);
          chat.scrollTop = chat.scrollHeight;
          return;
        }

        if (style === "analytical") {
          const block = document.createElement("article");
          block.className = "copilot-answer-block";
          const head = document.createElement("div");
          head.className = "copilot-answer-head";
          const avatar = document.createElement("span");
          avatar.className = "copilot-avatar";
          avatar.textContent = "✦";
          const label = document.createElement("span");
          label.className = "copilot-answer-label";
          label.textContent = "Enterprise Financial AI Copilot";
          head.append(avatar, label);
          block.appendChild(head);

          const secSummary = document.createElement("section");
          secSummary.className = "copilot-answer-section";
          const hSum = document.createElement("h4");
          hSum.textContent = "Summary";
          const pSum = document.createElement("p");
          pSum.className = "copilot-summary-text";
          pSum.textContent = data.summary || "—";
          secSummary.append(hSum, pSum);
          block.appendChild(secSummary);

          const findings = data.key_findings || [];
          if (findings.length) {
            const secFind = document.createElement("section");
            secFind.className = "copilot-answer-section";
            const hF = document.createElement("h4");
            hF.textContent = "Key Findings";
            const ul = document.createElement("ul");
            ul.className = "copilot-findings";
            findings.forEach((f) => {
              const li = document.createElement("li");
              li.textContent = f;
              ul.appendChild(li);
            });
            secFind.append(hF, ul);
            block.appendChild(secFind);
          }

          const rec = (data.recommended_action || "").trim();
          if (rec) {
            const secAct = document.createElement("section");
            secAct.className = "copilot-answer-section";
            const hA = document.createElement("h4");
            hA.textContent = "Recommended Action";
            const pA = document.createElement("p");
            pA.className = "copilot-recommended";
            pA.textContent = rec;
            secAct.append(hA, pA);
            block.appendChild(secAct);
          }

          chat.appendChild(block);
          chat.scrollTop = chat.scrollHeight;
          return;
        }

        if (style === "records" && records.length === 0) {
          const row = document.createElement("div");
          row.className = "chat-message-row bot";
          const avatar = document.createElement("span");
          avatar.className = "copilot-avatar small";
          avatar.textContent = "✦";
          const div = document.createElement("div");
          div.className = "chat-bubble bot";
          div.textContent = data.summary || "—";
          row.append(avatar, div);
          chat.appendChild(row);
          chat.scrollTop = chat.scrollHeight;
          return;
        }

        const block = document.createElement("article");
        block.className = "copilot-answer-block";
        const head = document.createElement("div");
        head.className = "copilot-answer-head";
        const avatar = document.createElement("span");
        avatar.className = "copilot-avatar";
        avatar.textContent = "✦";
        const label = document.createElement("span");
        label.className = "copilot-answer-label";
        label.textContent = "Enterprise Financial AI Copilot";
        head.append(avatar, label);
        block.appendChild(head);

        const secSummary = document.createElement("section");
        secSummary.className = "copilot-answer-section";
        const hSum = document.createElement("h4");
        hSum.textContent = "Summary";
        const pSum = document.createElement("p");
        pSum.className = "copilot-summary-text";
        pSum.textContent = data.summary || "—";
        secSummary.append(hSum, pSum);
        block.appendChild(secSummary);

        const findings = data.key_findings || [];
        if (findings.length) {
          const secFind = document.createElement("section");
          secFind.className = "copilot-answer-section";
          const hF = document.createElement("h4");
          hF.textContent = "Key Findings";
          const ul = document.createElement("ul");
          ul.className = "copilot-findings";
          findings.forEach((f) => {
            const li = document.createElement("li");
            li.textContent = f;
            ul.appendChild(li);
          });
          secFind.append(hF, ul);
          block.appendChild(secFind);
        }

        if (records.length > 0) {
          const secTbl = document.createElement("section");
          secTbl.className = "copilot-answer-section";
          const hT = document.createElement("h4");
          hT.textContent = "Matching Records";
          secTbl.appendChild(hT);
          secTbl.appendChild(buildInlineRecordsTable(records, 240));
          block.appendChild(secTbl);
        }

        const rec = (data.recommended_action || "").trim();
        if (rec) {
          const secAct = document.createElement("section");
          secAct.className = "copilot-answer-section";
          const hA = document.createElement("h4");
          hA.textContent = "Recommended Action";
          const pA = document.createElement("p");
          pA.className = "copilot-recommended";
          pA.textContent = rec;
          secAct.append(hA, pA);
          block.appendChild(secAct);
        }

        chat.appendChild(block);
        chat.scrollTop = chat.scrollHeight;
      }

      async function ask(question) {
        if (!question.trim()) return;
        appendChatBubble("user", question);
        const typing = showTypingIndicator();
        try {
          const res = await fetch(`${apiBase}/ask`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question, session_id: state.sessionId || null }),
          });
          const data = await res.json();
          typing.remove();
          if (!res.ok) throw new Error(data.detail || "Copilot request failed");
          if (data.session_id) {
            state.sessionId = data.session_id;
            sessionStorage.setItem("teamCopilotSessionId", state.sessionId);
          }
          appendStructuredCopilotMessage(data);
        } catch (err) {
          typing.remove();
          appendChatBubble("bot", String(err));
        }
      }

      document.getElementById("askBtn").addEventListener("click", () => {
        const input = document.getElementById("questionInput");
        const q = input.value.trim();
        input.value = "";
        ask(q);
      });

      document.getElementById("questionInput").addEventListener("keydown", (event) => {
        if (event.key === "Enter") document.getElementById("askBtn").click();
      });

      document.querySelectorAll("#copilotPromptCards .copilot-prompt-card").forEach((btn) => {
        btn.addEventListener("click", () => {
          const q = btn.getAttribute("data-q") || "";
          if (!q) return;
          document.getElementById("questionInput").value = q;
          document.getElementById("askBtn").click();
        });
      });

      appendChatBubble(
        "bot",
        "Welcome. Answers use the same CSV your admin uploaded (active_invoices.csv). Ask any finance question."
      );
    </script>
  </body>
</html>
